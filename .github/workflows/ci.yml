name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          EMBEDDING_ENABLED: "0"
          PYTHONUTF8: "1"
        run: pytest --cov=tsuzuri --cov-report=term
      - name: Demo and evaluation (offline)
        env:
          PYTHONUTF8: "1"
        run: |
          tsuzuri demo
          # regression gate at the current offline baseline (7/16); raise it as recall improves
          tsuzuri eval --min-pass-rate 0.43

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel into a clean environment and run the demo
        env:
          PYTHONUTF8: "1"
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/tsuzuri demo
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
