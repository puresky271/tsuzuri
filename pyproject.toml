[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tsuzuri"
version = "0.1.1"
description = "Long-term conversational memory and a context compiler for multi-agent character chat."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "tsuzuri contributors" }]
keywords = ["llm", "memory", "agents", "chatbot", "rag", "character-ai", "long-term-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "jieba>=0.42",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/puresky271/tsuzuri"
Documentation = "https://github.com/puresky271/tsuzuri/tree/main/docs"
Issues = "https://github.com/puresky271/tsuzuri/issues"
Changelog = "https://github.com/puresky271/tsuzuri/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = ["openai>=1.30"]
embeddings = ["sentence-transformers>=2.7", "FlagEmbedding>=1.2", "torch>=2.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "build>=1.2", "openai>=1.30"]

[project.scripts]
tsuzuri = "tsuzuri.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tsuzuri"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README*.md", "LICENSE", "NOTICE", "CHANGELOG.md",
           "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
